name: Feedmark native checks

on:
  push:
    branches: [feedmark]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-baseline:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Build and drive the real native reader
        run: python tools/verify-feedmark.py ci-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedmark-native-evidence
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.yaml
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
            .audit/verification/*/*.xcresult/**
            .audit/verification/*/maestro-evidence/**
            .audit/verification/*/notebook-evidence/**
            .audit/verification/*/reopen-evidence/**
            .audit/verification/*/native-artifacts/**
          retention-days: 7
