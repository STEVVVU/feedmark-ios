name: Feedmark checks

on:
  push:
    branches: [feedmark]
  workflow_dispatch:
    inputs:
      drive_native:
        description: Drive the optional native UI acceptance workflow
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Lint the changed native sources
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$RUNNER_TEMP/feedmark-swiftlint"
          mkdir "$lint_dir"
          curl --fail --location --connect-timeout 15 --max-time 120 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$lint_dir/portable_swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $lint_dir/portable_swiftlint.zip" | shasum -a 256 --check
          unzip -q "$lint_dir/portable_swiftlint.zip" -d "$lint_dir"
          "$lint_dir/swiftlint" version
          "$lint_dir/swiftlint" lint --strict iOS/Notebook Tests/NetNewsWire-iOSTests/NotebookTests.swift \
            Tests/NetNewsWire-iOSTests/ArticleStringFormatterSummaryCacheTests.swift Shared/Extensions/ArticleStringFormatter.swift \
            iOS/Article/ArticleViewController.swift iOS/Article/WebViewController.swift iOS/MainTimeline/MainTimelineViewController.swift
      - name: Build and run the iOS test plan
        if: github.event_name != 'workflow_dispatch' || !inputs.drive_native
        run: python tools/verify-feedmark.py ci-${{ github.run_id }} --build-only
      - name: Build and drive the real native reader
        if: github.event_name == 'workflow_dispatch' && inputs.drive_native
        run: python tools/verify-feedmark.py ci-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedmark-native-evidence
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.yaml
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
            .audit/verification/*/*.xcresult/**
            .audit/verification/*/*-evidence/**
            .audit/verification/*/native-artifacts/**
          retention-days: 7
