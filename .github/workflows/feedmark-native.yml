name: Feedmark checks

on:
  push:
    branches: [feedmark]
  workflow_dispatch:
    inputs:
      drive_native:
        description: Drive the optional native UI acceptance workflow
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.stage-meta.outputs.name }}
      producer-attempt: ${{ steps.stage-meta.outputs.attempt }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Lint the changed native sources
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$RUNNER_TEMP/feedmark-swiftlint"
          mkdir "$lint_dir"
          curl --fail --location --connect-timeout 15 --max-time 120 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$lint_dir/portable_swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $lint_dir/portable_swiftlint.zip" | shasum -a 256 --check
          unzip -q "$lint_dir/portable_swiftlint.zip" -d "$lint_dir"
          "$lint_dir/swiftlint" version
          "$lint_dir/swiftlint" lint --strict iOS/Notebook Tests/NetNewsWire-iOSTests/NotebookTests.swift \
            Tests/NetNewsWire-iOSTests/ArticleStringFormatterSummaryCacheTests.swift Shared/Extensions/ArticleStringFormatter.swift \
            iOS/Article/ArticleViewController.swift iOS/Article/WebViewController.swift iOS/MainTimeline/MainTimelineViewController.swift
      - name: Test the verification driver
        run: python -m unittest discover -s tools -p 'test_verify_feedmark.py'
      - name: Build and run the iOS test plan
        if: github.event_name != 'workflow_dispatch' || !inputs.drive_native
        run: python tools/verify-feedmark.py ci-build-${{ github.run_id }} --build-only
      - name: Build and stage the tested app
        if: github.event_name == 'workflow_dispatch' && inputs.drive_native
        run: python tools/verify-feedmark.py ci-build-${{ github.run_id }} --build-only --stage-build
      - name: Record staged artifact identity
        if: github.event_name == 'workflow_dispatch' && inputs.drive_native
        id: stage-meta
        run: |
          echo "name=feedmark-tested-app-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.drive_native
        with:
          name: ${{ steps.stage-meta.outputs.name }}
          path: .audit/verification/ci-build-${{ github.run_id }}/stage/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedmark-build-evidence-${{ github.run_attempt }}
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.yaml
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
            .audit/verification/*/*.xcresult/**
            .audit/verification/*/*-evidence/**
            .audit/verification/*/native-artifacts/**
          retention-days: 7

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.drive_native
    needs: build-and-test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-and-test.outputs.artifact-name }}
          path: .audit/staged-app-${{ github.run_id }}
      - name: Drive the tested native app
        run: python tools/verify-feedmark.py ci-native-${{ github.run_id }} --native-from .audit/staged-app-${{ github.run_id }} --producer-attempt '${{ needs.build-and-test.outputs.producer-attempt }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedmark-native-evidence-${{ github.run_attempt }}
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.yaml
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
            .audit/verification/*/*-evidence/**
            .audit/verification/*/native-artifacts/**
          retention-days: 7
